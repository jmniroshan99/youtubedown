<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c51f3d" />
    <meta
      name="description"
      content="youtubedown — paste a video link, prepare your video and save it to your device."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=red-1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=red-1" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=red-1" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=red-1" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=red-1" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest?v=red-1" />
    <meta name="application-name" content="youtubedown" />
    <meta name="apple-mobile-web-app-title" content="youtubedown" />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-v5.3.0.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("vf-theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>youtubedown</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
