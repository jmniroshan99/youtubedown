# Local Windows/macOS/Linux ingress. Use with docker-compose.yml, never with the production override.
services:
  api:
    # Local-only browser origins override older saved backend environment files.
    # Production never loads this override.
    environment:
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    networks:
      private: {}
      local_api: {}
  local-gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8000:8080"]
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks: [local_api, local_ingress]
    environment:
      NO_PROXY: api,localhost,127.0.0.1
      no_proxy: api,localhost,127.0.0.1
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    # The official image sets this file capability on /usr/bin/caddy.
    # Without it in the bounding set, Linux can refuse to execute Caddy,
    # even on port 8080. Keep every other capability dropped.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m,mode=1777"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-T", "12", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

networks:
  local_api:
    internal: true
  local_ingress: {}
