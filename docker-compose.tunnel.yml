# Optional testing ingress. Combine with base + local, never with production.
# Existing services and private worker/Redis/egress networks are preserved.
services:
  api:
    environment:
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://youtubedownl.netlify.app"
  tunnel:
    # Official multi-architecture image, pinned to the inspected registry digest.
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: ["tunnel", "--no-autoupdate", "--url", "http://local-gateway:8080"]
    networks: [local_ingress]
    depends_on:
      local-gateway:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    restart: "no"
