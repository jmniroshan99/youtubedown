# Docker Compose 2.24.4+ is required for !reset.
services:
  api:
    ports: !reset []
    environment:
      TRUSTED_PROXY_CIDRS: ${GATEWAY_PROXY_IP:-172.31.248.2}/32
    networks:
      private: {}
      gateway: {}
  gateway:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
      API_EMAIL: ${API_EMAIL:?Set API_EMAIL in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      gateway:
        ipv4_address: ${GATEWAY_PROXY_IP:-172.31.248.2}
      outbound: {}
    restart: unless-stopped
    depends_on: [api]
networks:
  gateway:
    internal: true
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:-172.31.248.0/29}
volumes:
  caddy-data: {}
  caddy-config: {}
